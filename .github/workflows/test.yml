name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          # renovate: datasource=github-runners
          - os: macos-26
            # renovate-xcodereleases: runs-on=macos-26
            xcode: "/Applications/Xcode_26.6.app"
          - os: ubuntu-latest
            # renovate: datasource=docker
            container: swift:6.4

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v7
      - name: Cache package build dir
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
            ${{ runner.os }}-spm-
      - name: Select Xcode
        if: ${{ matrix.xcode != null }}
        run: sudo xcode-select --switch "${{ matrix.xcode }}"
      - name: Run tests
        run: |
          swift test

  status-check:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "All builds succeeded"
          else
            echo "Some builds failed"
            exit 1
          fi
